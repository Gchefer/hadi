spring.application.name=hado-backend
server.port=8080

# Banco H2 em ARQUIVO (backend/data/hadodb.mv.db) - zero configuração e os dados sobrevivem a reinícios
# (antes era em memória: cadastros sumiam a cada restart e sessões salvas no navegador ficavam órfãs).
# O seed de produtos/cliente de teste só roda quando as tabelas estão vazias. Para zerar, apague backend/data/.
spring.datasource.url=jdbc:h2:file:./data/hadodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console do H2 em http://localhost:8080/h2-console (JDBC URL acima, usuário sa, senha em branco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Painel admin / uploads ---
# Login do painel admin (admin.html). O login gera um token enviado no header X-Admin-Token,
# exigido para cadastrar/alterar/excluir produtos e remover avaliações. TROQUE a senha em produção.
hadi.admin.usuario=${HADI_ADMIN_USUARIO:admin}
hadi.admin.senha=${HADI_ADMIN_SENHA:hadi-admin}
hadi.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Inclui a mensagem do ResponseStatusException no JSON de erro (ex.: "Usuário ou senha de administrador inválidos."),
# para o frontend exibir o motivo em vez de um erro genérico.
server.error.include-message=always
